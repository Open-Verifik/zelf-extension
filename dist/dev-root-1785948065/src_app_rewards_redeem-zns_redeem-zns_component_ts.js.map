<div class="zelf-card redeem-zns">
    <!-- Header -->
    <div class="redeem-zns__header">
        <div class="redeem-zns__col1">
            <button
                [routerLink]="['/rewards']"
                class="zelf-icon-button zelf-icon-button--secondary zelf-icon-button--40"
                mat-flat-button
            >
                <svg width="22" height="14" viewBox="0 0 22 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path
                        d="M20.0898 5.8277H4.72478L8.08478 2.4677C8.53978 2.0127 8.53978 1.2777 8.08478 0.822695C7.62978 0.367695 6.89478 0.367695 6.43978 0.822695L1.08478 6.1777C0.62978 6.6327 0.62978 7.3677 1.08478 7.8227L6.43978 13.1777C6.89478 13.6327 7.62978 13.6327 8.08478 13.1777C8.53978 12.7227 8.53978 11.9877 8.08478 11.5327L4.72478 8.16103H20.0898C20.7314 8.16103 21.2564 7.63603 21.2564 6.99436C21.2564 6.3527 20.7314 5.8277 20.0898 5.8277Z"
                    />
                </svg>
            </button>
        </div>

        <div class="redeem-zns__col2">
            <p class="redeem-zns__title">Redeem $ZNS</p>
        </div>

        <div class="redeem-zns__col3"></div>
    </div>

    <!-- Content: balance + options -->
    <div class="redeem-zns__app-content">
        <div class="redeem-zns__container">
            <!-- Balance -->
            <div class="redeem-zns__balance-section">
                <div class="redeem-zns__balance-label">You have</div>
                <div class="redeem-zns__balance-amount">
                    {{ znsBalanceLoading ? "..." : (znsBalance | number:'1.2-4') }} $ZNS
                </div>
            </div>

            <!-- Redemption options -->
            <div class="redeem-zns__options">
                <button
                    *ngFor="let opt of options"
                    type="button"
                    class="redeem-zns__option"
                    [class.redeem-zns__option--disabled]="isOptionDisabled(opt)"
                    [disabled]="isOptionDisabled(opt)"
                    (click)="onOptionClick(opt)"
                >
                    <div class="redeem-zns__option-text">
                        <span class="redeem-zns__option-title">{{ opt.title }}</span>
                        <span class="redeem-zns__option-cost">{{ opt.costZns | number }} ZNS</span>
                    </div>
                    <div class="redeem-zns__option-arrow">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M9 18L15 12L9 6"
                                stroke="currentColor"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                        </svg>
                    </div>
                </button>
            </div>
        </div>
    </div>
</div>
