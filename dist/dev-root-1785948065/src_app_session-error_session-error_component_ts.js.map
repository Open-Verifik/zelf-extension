<ng-container *transloco="let t">
    <div class="session-error__language">
        <language></language>
    </div>

    <div class="zelf-card session-error">
        <div class="zelf-card__content zelf-card__content--grow session-error__content">
            <svg width="60" height="60" viewBox="0 0 60 60" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M59.049 16.6L43.449 1C42.8156 0.366667 41.949 0 41.0823 0H18.949C18.0823 0 17.2156 0.366667 16.6156 0.966667L0.982292 16.6C0.382292 17.2 0.015625 18.0667 0.015625 18.9333V41.0333C0.015625 41.9333 0.382292 42.7667 0.982292 43.4L16.5823 59C17.2156 59.6333 18.0823 60 18.949 60H41.049C41.949 60 42.7823 59.6333 43.4156 59.0333L59.0156 43.4333C59.649 42.8 59.9823 41.9667 59.9823 41.0667V18.9333C60.0156 18.0667 59.649 17.2 59.049 16.6ZM53.349 39.6667L39.6823 53.3333H20.349L6.68229 39.6667V20.3333L20.349 6.66667H39.6823L53.349 20.3333V39.6667Z"
                    fill="#FF5721"
                />
                <path
                    d="M30.0156 46.6667C31.8566 46.6667 33.349 45.1743 33.349 43.3333C33.349 41.4924 31.8566 40 30.0156 40C28.1747 40 26.6823 41.4924 26.6823 43.3333C26.6823 45.1743 28.1747 46.6667 30.0156 46.6667Z"
                    fill="#FF5721"
                />
                <path
                    d="M30.0156 13.3333C28.1823 13.3333 26.6823 14.8333 26.6823 16.6667V33.3333C26.6823 35.1667 28.1823 36.6667 30.0156 36.6667C31.849 36.6667 33.349 35.1667 33.349 33.3333V16.6667C33.349 14.8333 31.849 13.3333 30.0156 13.3333Z"
                    fill="#FF5721"
                />
            </svg>

            <h2 class="session-error__title">{{ t("errors.session_init_title") }}</h2>
            <p class="session-error__message">{{ t("errors.session_init_message") }}</p>

            <div class="session-error__banner">
                <div class="session-error__banner-row">
                    <div class="session-error__banner-icon">
                        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M9 5H11V7H9V5ZM9 9H11V15H9V9ZM10 0C4.48 0 0 4.48 0 10C0 15.52 4.48 20 10 20C15.52 20 20 15.52 20 10C20 4.48 15.52 0 10 0ZM10 18C5.59 18 2 14.41 2 10C2 5.59 5.59 2 10 2C14.41 2 18 5.59 18 10C18 14.41 14.41 18 10 18Z"
                                fill="currentColor"
                            />
                        </svg>
                    </div>

                    <p class="session-error__banner-text">{{ t("errors.session_init_info") }}</p>
                </div>

                <button (click)="goToDownload()" class="zelf-button zelf-button--outlined zelf-button--wide session-error__banner-button">
                    {{ t("common.download_apps") }}
                </button>
            </div>
        </div>

        <div class="zelf-card__actions">
            <button (click)="tryAgain()" class="zelf-button zelf-button--wide zelf-button--primary">
                {{ t("common.try_again") }}
            </button>
        </div>
    </div>
</ng-container>
