<ng-container *transloco="let t">
    <div class="my-zns">
        <button mat-icon-button class="my-zns__exit" (click)="cancel()">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M13.3 0.710703C12.91 0.320703 12.28 0.320703 11.89 0.710703L6.99997 5.5907L2.10997 0.700703C1.71997 0.310703 1.08997 0.310703 0.699971 0.700703C0.309971 1.0907 0.309971 1.7207 0.699971 2.1107L5.58997 7.0007L0.699971 11.8907C0.309971 12.2807 0.309971 12.9107 0.699971 13.3007C1.08997 13.6907 1.71997 13.6907 2.10997 13.3007L6.99997 8.4107L11.89 13.3007C12.28 13.6907 12.91 13.6907 13.3 13.3007C13.69 12.9107 13.69 12.2807 13.3 11.8907L8.40997 7.0007L13.3 2.1107C13.68 1.7307 13.68 1.0907 13.3 0.710703Z"
                />
            </svg>
        </button>

        <div class="my-zns__body">
            <svg class="my-zns__icon" width="68" height="68" viewBox="0 0 36 29" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path

                    fill="#181818"
                />
                <path
                    d="M35.9922 17.0201C35.9922 7.62016 28.3564 0 18.937 0C9.51772 0 1.51654 7.62016 1.51654 17.0201V27.643C1.51551 28.0033 1.65844 28.349 1.91366 28.6037C2.16889 28.8584 2.51536 29.001 2.8763 29H4.8188C5.17974 29.001 5.5262 28.8584 5.78143 28.6037C6.03666 28.349 6.17958 28.0033 6.17855 27.643V18.8189C6.17855 18.0695 6.78733 17.462 7.5383 17.462H10.3044C11.0554 17.462 11.6642 18.0695 11.6642 18.8189V27.643C11.6631 28.0033 11.806 28.349 12.0613 28.6037C12.3165 28.8584 12.663 29.001 13.0239 29H14.9664C15.3274 29.001 15.6738 28.8584 15.929 28.6037C16.1843 28.349 16.3272 28.0033 16.3262 27.643V24.964C16.3262 22.2838 17.759 19.8072 20.0849 18.4671C22.4109 17.127 25.2765 17.127 27.6024 18.4671C29.9283 19.8072 31.3611 22.2838 31.3611 24.964V27.643C31.3611 28.3924 31.9699 29 32.7209 29H34.6402C35.3912 29 36 28.3924 36 27.643L35.9922 17.0201ZM11.3339 13.3971C11.0795 13.8068 10.7305 14.1497 10.316 14.3973C9.59396 14.8108 8.72685 14.8887 7.94232 14.6106C7.82837 14.5754 7.7198 14.5245 7.61992 14.4594C6.72382 13.9684 6.16694 13.0293 6.16694 12.0091C6.16694 10.9889 6.72382 10.0499 7.61992 9.55885C7.72449 9.49216 7.83837 9.44128 7.9579 9.40763C8.97763 9.04985 10.1126 9.3025 10.8833 10.059C11.4251 10.5583 11.7323 11.2615 11.7302 11.9975C11.7294 12.4915 11.5923 12.9757 11.3339 13.3971Z"
                    fill="#181818"
                />
            </svg>

            <h4 class="my-zns__title">
                {{ t("my_arns.arns_website") }}
            </h4>

            <p class="my-zns__text" *ngIf="isMainnet">
                {{ t("my_arns.description") }}
            </p>

            <p class="my-zns__text" *ngIf="!isMainnet">
                <strong>Purchase your tag name to enjoy the benefits</strong> of your personal website to receive crypto, easy to share with all
                necessary info for direct transfers.
            </p>
        </div>

        <div class="my-zns__actions">
            <ng-container *ngIf="isMainnet">
                <ng-container *ngIf="isLoadingArnsUrl; else loadedOrError">
                    <mat-spinner mode="indeterminate" diameter="24"></mat-spinner>
                </ng-container>
                <ng-template #loadedOrError>
                    <ng-container *ngIf="hasLoadError; else successButton">
                        <p class="my-zns__error">{{ t("my_arns.load_error") }}</p>
                        <button class="zelf-button zelf-button--primary zelf-button--wide" mat-flat-button (click)="retry()">
                            {{ t("my_arns.retry") }}
                        </button>
                    </ng-container>
                    <ng-template #successButton>
                        <button class="zelf-button zelf-button--primary zelf-button--wide" mat-flat-button [disabled]="!arnsUrl" (click)="close()">
                            {{ t("my_arns.arns_website") }}
                        </button>
                    </ng-template>
                </ng-template>
            </ng-container>

            <ng-container *ngIf="!isMainnet">
                <button class="zelf-button zelf-button--primary zelf-button--wide" mat-flat-button (click)="goToPurchase()">
                    {{ t("common.buy_now") }}
                </button>
            </ng-container>
        </div>
    </div>
</ng-container>
