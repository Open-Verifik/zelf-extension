<div class="zelf-card" *transloco="let t">
    <ng-container *ngIf="!loading">
        <div class="zelf-card__header welcome-complete__header">
            <h3 class="zelf-card__pretitle">{{ t("welcome.your_zelf_name") }}</h3>

            <h2
                #tagTitle
                class="zelf-card__title welcome-complete__tag-title"
                [style.fontSize.px]="tagNameFontSizePx"
                [style.lineHeight.px]="tagNameLineHeightPx"
            >
                {{ wallet?.fullTagName }}
            </h2>

            <img class="qr-code mt-4" [src]="wallet?.image" alt="zelfProof" />
        </div>

        <div class="zelf-card__content">
            <div class="zelf-action-row">
                <p class="zelf-action-row__text">{{ t("common.download_zelfproof") }}</p>

                <button (click)="downloadQRCode()" mat-icon-button class="zelf-icon-button zelf-icon-button--border-soft zelf-icon-button--40">
                    <svg width="14" height="18" viewBox="0 0 14 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path
                            d="M11.59 6.5H10V1.5C10 0.95 9.55 0.5 9 0.5H5C4.45 0.5 4 0.95 4 1.5V6.5H2.41C1.52 6.5 1.07 7.58 1.7 8.21L6.29 12.8C6.68 13.19 7.31 13.19 7.7 12.8L12.29 8.21C12.92 7.58 12.48 6.5 11.59 6.5ZM0 16.5C0 17.05 0.45 17.5 1 17.5H13C13.55 17.5 14 17.05 14 16.5C14 15.95 13.55 15.5 13 15.5H1C0.45 15.5 0 15.95 0 16.5Z"
                        />
                    </svg>
                </button>
            </div>

            <mnemonic (redirect)="onMnemonicUnlock()"></mnemonic>
        </div>

        <div class="zelf-card__actions welcome-complete__actions">
            <button (click)="complete()" [routerLink]="['../../home']" class="zelf-button zelf-button--primary zelf-button--wide" mat-flat-button>
                {{ t("common.continue") }}
            </button>
        </div>
    </ng-container>

    <zelf-loader [diameter]="30" *ngIf="loading"></zelf-loader>
</div>
