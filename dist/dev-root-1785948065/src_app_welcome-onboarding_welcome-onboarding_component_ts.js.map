<div class="welcome-onboarding" *transloco="let t">
    <div class="welcome-onboarding__header">
        <div class="carousel">
            <div class="carousel__item-container">
                <div class="carousel__item">
                    <div class="carousel__device" [class.carousel__device--summary]="currentSlide.featureBulletKeys.length">
                        <button
                            *ngIf="showHomeButton"
                            class="welcome-onboarding__home-button zelf-icon-button zelf-icon-button--40 zelf-icon-button--secondary"
                            type="button"
                            [routerLink]="['/home']"
                            [attr.aria-label]="t('common.home')"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 32 32" aria-hidden="true" focusable="false">
                                <path
                                    d="M16.0003 8.25366L22.667 14.2537V24.667H20.0003V16.667H12.0003V24.667H9.33366V14.2537L16.0003 8.25366ZM16.0003 4.66699L2.66699 16.667H6.66699V27.3337H14.667V19.3337H17.3337V27.3337H25.3337V16.667H29.3337L16.0003 4.66699Z"
                                />
                            </svg>
                        </button>

                        <div class="carousel__device-bottom-fill"></div>
                        <div class="carousel__device-glow"></div>
                        <div class="carousel__device-bottom-glow"></div>

                        <ng-container *ngIf="!currentSlide.featureBulletKeys.length; else summarySlide">
                            <div class="carousel__stage" [class.carousel__content--hidden]="isTransitioning">
                                <div class="carousel__eyebrow">{{ t(currentSlide.eyebrowKey) }}</div>

                                <div class="carousel__feature-stack">
                                    <div
                                        class="carousel__feature-row"
                                        *ngFor="let highlight of currentSlide.highlights"
                                        [class.carousel__feature-row--active]="currentSlide.activeHighlight === highlight.id"
                                        [class.carousel__feature-row--muted]="currentSlide.activeHighlight !== highlight.id"
                                    >
                                        <span class="carousel__feature-icon">
                                            <ng-container [ngSwitch]="highlight.icon">
                                                <!-- Wallet: coin/token icon with circle bg -->
                                                <svg *ngSwitchCase="'wallet'" aria-hidden="true" focusable="false" viewBox="0 0 32 32" fill="none">
                                                    <rect width="32" height="32" rx="10" fill="currentColor"/>
                                                    <path d="M9 13C9 11.34 10.34 10 12 10H22C22.55 10 23 10.45 23 11V21C23 22.66 21.66 24 20 24H12C10.34 24 9 22.66 9 21V13Z" fill="white" opacity="0.9"/>
                                                    <path d="M20 17.5C20 18.33 19.33 19 18.5 19C17.67 19 17 18.33 17 17.5C17 16.67 17.67 16 18.5 16C19.33 16 20 16.67 20 17.5Z" fill="currentColor"/>
                                                    <path d="M22 14H11C10.45 14 10 13.55 10 13C10 12.45 10.45 12 11 12H21C21.55 12 22 12.45 22 13V14Z" fill="white" opacity="0.45"/>
                                                </svg>
                                                <!-- PWD Mgrs: lock icon with circle bg -->
                                                <svg *ngSwitchCase="'password'" aria-hidden="true" focusable="false" viewBox="0 0 32 32" fill="none">
                                                    <rect width="32" height="32" rx="10" fill="currentColor"/>
                                                    <rect x="9" y="16" width="14" height="10" rx="2.5" fill="white" opacity="0.9"/>
                                                    <path d="M12 16V13C12 10.79 13.79 9 16 9C18.21 9 20 10.79 20 13V16" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
                                                    <circle cx="16" cy="21" r="1.5" fill="currentColor"/>
                                                </svg>
                                                <!-- 2FAs: fingerprint icon with circle bg -->
                                                <svg *ngSwitchCase="'fingerprint'" aria-hidden="true" focusable="false" viewBox="0 0 32 32" fill="none">
                                                    <rect width="32" height="32" rx="10" fill="currentColor"/>
                                                    <path d="M16 9C12.69 9 10 11.69 10 15C10 18.87 11.58 22.36 14.15 24.85" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.5"/>
                                                    <path d="M22 15C22 11.69 19.31 9 16 9" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
                                                    <path d="M13 15C13 13.34 14.34 12 16 12C17.66 12 19 13.34 19 15C19 17.76 17.88 20.24 16.04 22" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
                                                    <path d="M16 15C16 17.21 15.16 19.22 13.77 20.73" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>
                                                    <path d="M19 22C20.23 20.47 21 18.32 21 15.9" stroke="white" stroke-width="1.8" stroke-linecap="round" opacity="0.4"/>
                                                </svg>
                                                <!-- Inheritance: document/will icon with circle bg -->
                                                <svg *ngSwitchCase="'inheritance'" aria-hidden="true" focusable="false" viewBox="0 0 32 32" fill="none">
                                                    <rect width="32" height="32" rx="10" fill="currentColor"/>
                                                    <path d="M12 8H20.17L24 11.83V24H12V8Z" fill="white" opacity="0.25"/>
                                                    <path d="M12 8H20.17L24 11.83V24H12V8Z" stroke="white" stroke-width="1.6" stroke-linejoin="round" opacity="0.9"/>
                                                    <path d="M20 8V12H24" stroke="white" stroke-width="1.6" stroke-linejoin="round" opacity="0.9"/>
                                                    <path d="M15 17H21M15 20H19" stroke="white" stroke-width="1.6" stroke-linecap="round" opacity="0.9"/>
                                                    <rect x="8" y="15" width="7" height="6" rx="1" fill="white" opacity="0.9"/>
                                                    <path d="M10 18H13" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
                                                </svg>
                                            </ng-container>
                                        </span>
                                        <span>{{ t(highlight.labelKey) }}</span>
                                    </div>
                                </div>
                            </div>
                        </ng-container>

                        <ng-template #summarySlide>
                            <div class="carousel__summary" [class.carousel__content--hidden]="isTransitioning">
                                <div class="carousel__intro">
                                    <div class="carousel__intro-line" *ngFor="let line of currentSlide.introLineKeys; let first = first">
                                        <span class="carousel__intro-dot" *ngIf="first"></span>
                                        <span>{{ t(line) }}</span>
                                    </div>
                                </div>

                                <div class="carousel__feature-bullets">
                                    <div class="carousel__feature-bullet" *ngFor="let bullet of currentSlide.featureBulletKeys">
                                        <span class="carousel__feature-bullet-dot"></span>
                                        <span>{{ t(bullet) }}</span>
                                    </div>
                                </div>
                            </div>
                        </ng-template>

                        <div class="carousel__mock-actions">
                            <button class="carousel__mock-button carousel__mock-button--primary" type="button" (click)="goToEnterAccount()">
                                <span>{{ t("welcome.enter_with_zelf_id") }}</span>
                            </button>
                            <button class="carousel__mock-button carousel__mock-button--secondary" type="button" (click)="goToCreateAccount()">
                                <span>{{ t("welcome.create_a_zelf_id") }}</span>
                            </button>
                            <button class="carousel__mock-link" type="button" (click)="goToImportAccount()">
                                {{ t("welcome.dont_remember_your_zelf_id") }}
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
