<div class="home-hub__header" fxLayout="row" fxLayoutAlign="space-between center" fxLayoutGap="12px" *transloco="let t">
    <div class="home-hub__header-left">
        <button type="button" class="home-hub__avatar-btn" (click)="profileClick.emit()" [attr.aria-label]="t('home_hub.header_profile_aria')">
            <div class="home-hub__avatar">
                <img src="assets/icons/profile_icon.svg" alt="" class="home-hub__avatar-img" aria-hidden="true" />
            </div>
        </button>
        <span class="home-hub__wallet-name" *ngIf="showName && walletName">{{ walletName }}</span>
        <button
            type="button"
            class="home-hub__name-toggle"
            *ngIf="walletName"
            (click)="toggleNameClick.emit()"
            [attr.aria-label]="showName ? t('home_hub.header_collapse_aria') : t('home_hub.header_expand_aria')"
        >
            <svg width="6" height="10" viewBox="0 0 8 14" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path *ngIf="!showName" d="M1 1L7 7L1 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                <path *ngIf="showName" d="M7 1L1 7L7 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
        </button>
    </div>
    <div class="home-hub__header-actions" fxLayout="row" fxLayoutAlign="end center" fxLayoutGap="8px">
        <a class="home-hub__icon-tile" routerLink="/rewards" [attr.aria-label]="t('home_hub.header_rewards_aria')">
            <img src="assets/icons/rewards_icon.svg" alt="" class="home-hub__header-icon" aria-hidden="true" />
        </a>
        <a
            class="home-hub__icon-tile home-hub__icon-tile--ghost"
            routerLink="/settings"
            [queryParams]="{ edit: 'notifications' }"
            [attr.aria-label]="t('home_hub.header_notifications_aria')"
        >
            <svg
                class="home-hub__header-icon home-hub__header-icon--svg"
                width="20"
                height="20"
                viewBox="0 0 20 20"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
                aria-hidden="true"
            >
                <path
                    d="M18.7961 11.3851L17.2127 5.6884C16.7486 4.01951 15.74 2.55364 14.3472 1.52379C12.9543 0.493945 11.2572 -0.0407771 9.52562 0.00462298C7.794 0.0500231 6.12724 0.67294 4.79028 1.77436C3.45333 2.87578 2.5229 4.39249 2.1469 6.0834L0.921062 11.5959C0.785658 12.205 0.788789 12.8368 0.930223 13.4445C1.07166 14.0522 1.34778 14.6205 1.73821 15.1072C2.12865 15.5939 2.62341 15.9868 3.18599 16.2567C3.74856 16.5266 4.36458 16.6668 4.98856 16.6667H5.9169C6.10816 17.6086 6.61917 18.4555 7.36335 19.0637C8.10752 19.672 9.0391 20.0042 10.0002 20.0042C10.9614 20.0042 11.8929 19.672 12.6371 19.0637C13.3813 18.4555 13.8923 17.6086 14.0836 16.6667H14.7819C15.4242 16.6668 16.0579 16.5183 16.6334 16.2329C17.2088 15.9476 17.7105 15.533 18.0992 15.0216C18.488 14.5103 18.7532 13.9159 18.8742 13.2851C18.9953 12.6543 18.968 12.004 18.7961 11.3851ZM10.0002 18.3334C9.48501 18.3313 8.98304 18.17 8.56298 17.8717C8.14292 17.5733 7.8253 17.1525 7.65356 16.6667H12.3469C12.1752 17.1525 11.8575 17.5733 11.4375 17.8717C11.0174 18.17 10.5154 18.3313 10.0002 18.3334ZM16.7719 14.0126C16.5397 14.3206 16.2388 14.5703 15.8932 14.7417C15.5476 14.9131 15.1668 15.0016 14.7811 15.0001H4.98856C4.61422 15 4.24466 14.9159 3.90718 14.7539C3.5697 14.5919 3.2729 14.3562 3.0387 14.0641C2.80449 13.7721 2.63886 13.4312 2.55403 13.0666C2.4692 12.702 2.46733 12.323 2.54856 11.9576L3.77356 6.44423C4.06886 5.11607 4.79965 3.92474 5.84978 3.05961C6.8999 2.19448 8.20908 1.70521 9.56921 1.66958C10.9293 1.63395 12.2623 2.054 13.3563 2.86296C14.4503 3.67192 15.2425 4.82336 15.6069 6.13423L17.1902 11.8309C17.2948 12.202 17.3115 12.5925 17.2389 12.9712C17.1663 13.3499 17.0064 13.7064 16.7719 14.0126Z"
                    fill="currentColor"
                />
            </svg>
        </a>
        <button
            type="button"
            class="home-hub__icon-tile home-hub__icon-tile--ghost"
            *ngIf="showOpenSidebar"
            (click)="openSidePanel()"
            [attr.aria-label]="t('common.open_in_sidebar')"
        >
            <svg class="home-hub__header-icon home-hub__header-icon--svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
                <path
                    d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h560q33 0 56.5 23.5T840-760v560q0 33-23.5 56.5T760-120H200Zm440-80h120v-560H640v560Zm-80 0v-560H200v560h360Zm80 0h120-120Z"
                />
            </svg>
        </button>
        <button
            type="button"
            class="home-hub__icon-tile home-hub__icon-tile--ghost"
            *ngIf="showOpenFullscreen"
            (click)="openFullScreen()"
            [attr.aria-label]="t('common.open_fullscreen')"
        >
            <svg class="home-hub__header-icon home-hub__header-icon--svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" aria-hidden="true">
                <path d="M120-120v-200h80v120h120v80H120Zm520 0v-80h120v-120h80v200H640ZM120-640v-200h200v80H200v120h-80Zm640 0v-120H640v-80h200v200h-80Z" />
            </svg>
        </button>
    </div>
</div>
