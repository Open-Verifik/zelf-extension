<div class="h-main w-full h-full" fxLayout="column" fxLayoutAlign="start center" *ngIf="transactionData">
	<div class="home-main" fxLayout="column" fxLayoutAlign="space-between start">
		<div class="w-full">
			<!-- header here -->
			<div class="w-full" fxLayout="row" fxLayoutAlign="start center" class="send-transaction-header">
				<div (click)="cancel()">
					<svg class="ml-2 cursor-pointer" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none">
						<path d="M20 11H7.83L13.42 5.41L12 4L4 12L12 20L13.41 18.59L7.83 13H20V11Z" fill="white" />
					</svg>
				</div>

				<div fxLayout="row" fxLayoutAlign="center center" class="w-full">
					<h4 class="m-0">
						{{ "send_transaction.confirmation_step" | transloco }}
					</h4>
				</div>
			</div>
			<!-- end of header -->
			<!-- main content -->
			<div class="w-full p-4" fxLayout="column" fxLayoutAlign="start center">
				<h2>$100.00 USDT</h2>

				<div class="st-confirmation-table" fxLayout="column" fxLayoutAlign="start start">
					<div class="st-confirmation-table-row" fxLayout="row" fxLayoutAlign="space-between center">
						<small> Withdrawal network </small>

						<small> ETH ERC-20 </small>
					</div>

					<div class="st-confirmation-table-row st-confirmation-table-row-top-b" fxLayout="row" fxLayoutAlign="space-between center">
						<small> Address </small>

						<small> 0x293AE4CCc60Fd539751687DAF16gf67</small>
					</div>

					<div class="st-confirmation-table-row st-confirmation-table-row-top-b" fxLayout="row" fxLayoutAlign="space-between center">
						<small> Coin </small>

						<small> USDT</small>
					</div>

					<div class="st-confirmation-table-row st-confirmation-table-row-top-b" fxLayout="row" fxLayoutAlign="space-between center">
						<small> Fee </small>

						<small> $2.78</small>
					</div>

					<div class="st-confirmation-table-row st-confirmation-table-row-top-b" fxLayout="row" fxLayoutAlign="space-between center">
						<small> Total </small>

						<small> $102.78</small>
					</div>
				</div>
			</div>
			<!-- end of main content -->
		</div>

		<div fxLayout="row" fxLayoutAlign="center center" class="w-full px-3 pb-4">
			<button mat-raised-button class="main-button" (click)="goNext()">
				{{ "send_transaction.confirm_transaction_button" | transloco }}
			</button>
		</div>
	</div>
</div>
