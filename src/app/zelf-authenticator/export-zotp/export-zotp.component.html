<div class="export-zotp" *transloco="let t">
    <div class="export-zotp__header">
        <h3 class="export-zotp__title">{{ t("zotp.export_zotp") }}</h3>
        <button mat-icon-button class="export-zotp__close" (click)="close()" [disabled]="loading">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M17.4 0.613295C16.88 0.0932946 16.04 0.0932946 15.52 0.613295L8.99996 7.11996L2.47996 0.599961C1.95996 0.0799609 1.11996 0.0799609 0.599961 0.599961C0.0799609 1.11996 0.0799609 1.95996 0.599961 2.47996L7.11996 8.99996L0.599961 15.52C0.0799609 16.04 0.0799609 16.88 0.599961 17.4C1.11996 17.92 1.95996 17.92 2.47996 17.4L8.99996 10.88L15.52 17.4C16.04 17.92 16.88 17.92 17.4 17.4C17.92 16.88 17.92 16.04 17.4 15.52L10.88 8.99996L17.4 2.47996C17.9066 1.97329 17.9066 1.11996 17.4 0.613295Z"
                />
            </svg>
        </button>
    </div>

    <div class="export-zotp__content">
        <div class="export-zotp__zotp-info" *ngIf="zotp">
            <div class="export-zotp__zotp-name">{{ zotp.name }}</div>
            <div class="export-zotp__zotp-issuer" *ngIf="zotp.issuer">{{ zotp.issuer }}</div>
        </div>

        <!-- Biometrics step -->
        <div class="export-zotp__biometrics" *ngIf="!metadata">
            <biometrics-general
                (canNavigate)="canNavigateAwayHandler($event)"
                (error)="onBiometricsFailed($event)"
                (imageCaptured)="onBiometricsScanned($event)"
            ></biometrics-general>
        </div>

        <!-- Setup key and QR code display after biometrics -->
        <div class="export-zotp__export-content" *ngIf="metadata && setupKey">
            <!-- QR Code Section -->
            <div class="export-zotp__qr-section">
                <div class="export-zotp__qr-label">{{ t("zotp.qr_code") }}</div>
                <div class="export-zotp__qr-container" #qrCodeContainer></div>
                <div class="export-zotp__qr-description">{{ t("zotp.qr_code_description") }}</div>
            </div>

            <!-- Setup Key Section -->
            <div class="export-zotp__setup-key">
                <div class="export-zotp__setup-key-label">{{ t("zotp.setup_key") }}</div>
                <div class="export-zotp__setup-key-value">
                    <code class="export-zotp__setup-key-code">{{ setupKey }}</code>
                    <button mat-flat-button class="export-zotp__copy-button" (click)="copySetupKey()">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path
                                d="M13.3333 6H7.33333C6.59695 6 6 6.59695 6 7.33333V13.3333C6 14.0697 6.59695 14.6667 7.33333 14.6667H13.3333C14.0697 14.6667 14.6667 14.0697 14.6667 13.3333V7.33333C14.6667 6.59695 14.0697 6 13.3333 6Z"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                            <path
                                d="M3.33333 10H2.66667C2.31305 10 2 9.68695 2 9.33333V3.33333C2 2.97971 2.31305 2.66667 2.66667 2.66667H8.66667C9.02029 2.66667 9.33333 2.97971 9.33333 3.33333V4"
                                stroke="currentColor"
                                stroke-width="1.5"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            />
                        </svg>
                        {{ t("common.copy") }}
                    </button>
                </div>
                <div class="export-zotp__setup-key-description">{{ t("zotp.setup_key_description") }}</div>

                <!-- Share Button -->
                <button mat-flat-button class="export-zotp__share-button" (click)="shareZOTP()">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 2L3 7H6V12H10V7H13L8 2ZM2 14V16H14V14H2Z" fill="currentColor" />
                    </svg>
                    {{ t("zotp.share_with_seal") }}
                </button>
            </div>
        </div>

        <!-- Loading state -->
        <div class="export-zotp__loading" *ngIf="loading && !metadata">
            <p>{{ t("common.loading") || "Loading..." }}</p>
        </div>
    </div>
</div>
