<div class="note-form">
    <div class="form-header">
        <button (click)="onCancel()" mat-flat-button class="zelf-icon-button zelf-icon-button--anti-flash-white zelf-icon-button--40">
            <svg width="22" height="14" viewBox="0 0 22 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M20.0898 5.8277H4.72478L8.08478 2.4677C8.53978 2.0127 8.53978 1.2777 8.08478 0.822695C7.62978 0.367695 6.89478 0.367695 6.43978 0.822695L1.08478 6.1777C0.62978 6.6327 0.62978 7.3677 1.08478 7.8227L6.43978 13.1777C6.89478 13.6327 7.62978 13.6327 8.08478 13.1777C8.53978 12.7227 8.53978 11.9877 8.08478 11.5327L4.72478 8.16103H20.0898C20.7314 8.16103 21.2564 7.63603 21.2564 6.99436C21.2564 6.3527 20.7314 5.8277 20.0898 5.8277Z"
                />
            </svg>
        </button>
        <h2>{{ isNewNote ? ("billing.notes.form.title.add" | transloco) : ("billing.notes.form.title.edit" | transloco) }}</h2>
    </div>

    <div class="form-content">
        <form (ngSubmit)="onSave()" #noteForm="ngForm">
            <!-- Title Section -->
            <div class="form-section">
                <label for="title" class="form-label">{{ "billing.notes.form.title_field.label" | transloco }}</label>
                <div class="zelf-input zelf-input--wide">
                    <input
                        type="text"
                        id="title"
                        name="title"
                        [(ngModel)]="noteData.title"
                        (ngModelChange)="checkFormValidity()"
                        class="zelf-input__control"
                        [placeholder]="'billing.notes.form.title_field.placeholder' | transloco"
                        required
                    />
                </div>
            </div>

            <!-- Note Content Section -->
            <div class="form-section">
                <label for="content" class="form-label">{{ "billing.notes.form.content.label" | transloco }}</label>
                <div class="zelf-input zelf-input--wide zelf-input--textarea">
                    <textarea
                        id="content"
                        name="content"
                        [(ngModel)]="noteData.content"
                        (ngModelChange)="checkFormValidity()"
                        class="zelf-input__control"
                        [placeholder]="'billing.notes.form.content.placeholder' | transloco"
                        rows="8"
                        required
                    ></textarea>
                </div>
                <small class="form-hint">{{ "billing.notes.form.content.hint" | transloco }}</small>
            </div>

            <!-- Folder Section -->
            <div class="form-section">
                <div class="folder-toggle">
                    <label class="form-label">{{ "billing.notes.form.folder.label" | transloco }}</label>
                    <div
                        class="zelf-toggle"
                        [class.zelf-toggle--active]="noteData.insideFolder"
                        (click)="toggleFolder()"
                        tabindex="0"
                        role="switch"
                        [attr.aria-checked]="noteData.insideFolder"
                        [attr.aria-label]="'billing.notes.form.folder.aria_label' | transloco"
                    >
                        <div class="zelf-toggle__track"></div>
                        <div class="zelf-toggle__thumb"></div>
                    </div>
                </div>

                <div *ngIf="noteData.insideFolder" class="folder-input">
                    <div class="zelf-input zelf-input--wide">
                        <input
                            type="text"
                            [(ngModel)]="noteData.folder"
                            id="folder"
                            class="zelf-input__control"
                            [placeholder]="'billing.notes.form.folder.placeholder' | transloco"
                        />
                    </div>
                </div>
            </div>

            <!-- Master Password Section -->
            <div class="form-section" *ngIf="hasMasterPassword">
                <div class="password-input-field">
                    <div class="zelf-input zelf-input--wide">
                        <input
                            [type]="showMasterPassword ? 'text' : 'password'"
                            id="masterPassword"
                            name="masterPassword"
                            [(ngModel)]="noteData.masterPassword"
                            (ngModelChange)="checkFormValidity()"
                            class="zelf-input__control"
                            [placeholder]="'billing.notes.form.master_password.placeholder' | transloco"
                        />
                        <button
                            type="button"
                            class="zelf-icon-button zelf-icon-button--transparent zelf-icon-button--no-fill"
                            (click)="toggleMasterPasswordVisibility()"
                            tabindex="-1"
                        >
                            <svg
                                *ngIf="!showMasterPassword"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="#181818"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg
                                *ngIf="showMasterPassword"
                                width="24"
                                height="24"
                                viewBox="0 0 24 24"
                                fill="none"
                                stroke="#181818"
                                stroke-width="2"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                            >
                                <path
                                    d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"
                                ></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                    <small class="form-hint">{{ "billing.notes.form.master_password.hint" | transloco: { walletName: wallet.name } }}</small>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="form-actions">
                <button type="button" class="zelf-button zelf-button--white" (click)="onCancel()">
                    {{ "billing.notes.form.buttons.cancel" | transloco }}
                </button>
                <button type="submit" class="zelf-button zelf-button--black" [disabled]="!formValid">
                    {{ isNewNote ? ("billing.notes.form.buttons.create" | transloco) : ("billing.notes.form.buttons.update" | transloco) }}
                </button>
            </div>
        </form>
    </div>
</div>
